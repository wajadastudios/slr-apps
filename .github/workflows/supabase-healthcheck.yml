name: Supabase health-check

# Keeps the Supabase Free project from looking inactive. Temporary measure --
# see README ("Health-check Supabase").
on:
  schedule:
    # 01:00 UTC = 08:00 WIB (Asia/Jakarta is UTC+7 year-round, no DST).
    # GitHub may start scheduled runs a few minutes late.
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call health-check endpoint
        env:
          HEALTHCHECK_URL: ${{ secrets.SLR_HEALTHCHECK_URL }}
          HEALTHCHECK_SECRET: ${{ secrets.SLR_HEALTHCHECK_SECRET }}
        run: |
          set -u

          # Pasted secrets often carry a stray newline or space; strip all
          # whitespace so it can never break the request.
          url=$(printf '%s' "$HEALTHCHECK_URL" | tr -d '[:space:]')
          token=$(printf '%s' "$HEALTHCHECK_SECRET" | tr -d '[:space:]')

          if [ -z "$url" ] || [ -z "$token" ]; then
            echo "::error::Health-check secrets are not configured."
            exit 1
          fi
          case "$url" in
            https://*) ;;
            *)
              echo "::error::SLR_HEALTHCHECK_URL must start with https://"
              exit 1
              ;;
          esac

          # The response body is discarded so nothing from it can reach the log
          # (GitHub also masks the token if it ever appeared).
          set +e
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --max-time 30 --retry 2 --retry-delay 15 --retry-all-errors \
            -H "Authorization: Bearer ${token}" "$url")
          curl_exit=$?
          set -e

          case "$status" in
            2??) echo "Health-check OK." ;;
            *)
              echo "::error::Health-check failed (HTTP ${status:-none}, curl exit ${curl_exit})."
              exit 1
              ;;
          esac
